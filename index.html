<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caspian Bridge International Ltd – Global Trade & Procurement</title>
<meta name="description" content="UK-registered international trading, procurement and business consultancy. Bridging Markets. Building Opportunities.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1628;--deep:#0d1f3c;--darker:#060e1a;
  --gold:#c9a84c;--gold2:#e8c97a;--gold3:#f5e199;
  --white:#fff;--gray:#8a9ab5;--gray2:#6a7a95;
  --border:rgba(201,168,76,0.22);--border2:rgba(255,255,255,0.07);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--white);overflow-x:hidden;cursor:none;}
body.ar{font-family:'Noto Sans Arabic',sans-serif;direction:rtl;}
body.ar *{letter-spacing:0!important;}

/* CURSOR */
#cur{position:fixed;width:9px;height:9px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);}
#cur2{position:fixed;width:36px;height:36px;border:1px solid rgba(201,168,76,.45);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:all .22s ease;opacity:.65;}
#cur2.big{width:56px;height:56px;opacity:.25;}

/* WHATSAPP FLOAT */
.wa-float{position:fixed;bottom:28px;right:28px;z-index:9000;width:60px;height:60px;
  background:linear-gradient(135deg,#25d366,#128c7e);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 22px rgba(37,211,102,.45);text-decoration:none;
  animation:waPop 3s infinite;}
.wa-float svg{width:30px;height:30px;}
body.ar .wa-float{right:auto;left:28px;}
@keyframes waPop{0%,100%{box-shadow:0 4px 22px rgba(37,211,102,.45);}
  50%{box-shadow:0 4px 22px rgba(37,211,102,.45),0 0 0 12px rgba(37,211,102,.09);}}

/* NOTIFICATION */
.notif{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);
  padding:13px 30px;border-radius:3px;font-size:14px;font-weight:500;z-index:9999;
  opacity:0;transition:all .4s;pointer-events:none;}
.notif.on{transform:translateX(-50%) translateY(0);opacity:1;}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:80px;
  display:flex;align-items:center;justify-content:space-between;padding:0 5%;
  background:rgba(10,22,40,.97);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);transition:all .4s;}
.nav-logo{display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none;}

/* LOGO — double size, spins WEST TO EAST (clockwise = left to right) */
.nav-logo-img{
  width:100px;height:100px;object-fit:contain;
  animation:spinWE 12s linear infinite;
  filter:drop-shadow(0 0 10px rgba(201,168,76,.35));}
@keyframes spinWE{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.nav-brand-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;
  color:var(--white);line-height:1.2;}
.nav-brand-sub{font-size:9px;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-top:2px;}
.nav-links{display:flex;align-items:center;gap:30px;list-style:none;}
.nav-links a{font-size:12px;color:var(--gray);cursor:pointer;letter-spacing:.7px;
  transition:color .3s;position:relative;padding-bottom:3px;text-decoration:none;}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1px;
  background:var(--gold);transition:width .3s;}
.nav-links a:hover{color:var(--gold);}
.nav-links a:hover::after{width:100%;}
body.ar .nav-links a::after{left:auto;right:0;}
.nav-end{display:flex;align-items:center;gap:12px;}
.lang-btn{padding:7px 15px;border:1px solid var(--border);background:transparent;
  color:var(--gold);font-size:11px;letter-spacing:1.5px;cursor:pointer;
  border-radius:3px;transition:all .3s;font-family:'DM Sans',sans-serif;}
.lang-btn:hover{background:var(--gold);color:var(--navy);}
.nav-cta{padding:9px 22px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--navy);font-size:11px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;border:none;border-radius:3px;cursor:pointer;transition:all .3s;}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(201,168,76,.35);}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;}
.hamburger span{width:22px;height:1.5px;background:var(--white);display:block;}

/* PAGES */
.pg{display:none;min-height:100vh;}
.pg.on{display:block;}

/* REVEAL */
.rev{opacity:0;transform:translateY(30px);transition:all .7s ease;}
.rev.vis{opacity:1;transform:translateY(0);}

/* SHARED */
.section-label{font-size:10px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;}
.section-h2{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,3.5vw,48px);font-weight:300;line-height:1.1;margin-bottom:14px;}
.section-h2 em{font-style:italic;color:var(--gold);}
.gold-rule{width:52px;height:1px;background:linear-gradient(to right,var(--gold),transparent);margin:16px 0 22px;}
body.ar .gold-rule{background:linear-gradient(to left,var(--gold),transparent);}
.body-text{font-size:15px;color:var(--gray);line-height:1.9;font-weight:300;}
.body-text strong{color:rgba(255,255,255,.85);font-weight:400;}
.btn-gold{padding:13px 32px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--navy);font-size:12px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;border:none;border-radius:3px;cursor:pointer;
  transition:all .3s;text-decoration:none;display:inline-block;}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(201,168,76,.4);}
.btn-ghost{padding:13px 32px;background:transparent;color:var(--white);
  font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.2);border-radius:3px;cursor:pointer;
  transition:all .3s;text-decoration:none;display:inline-block;}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}

/* PAGE HERO */
.page-hero{position:relative;height:380px;display:flex;align-items:flex-end;
  overflow:hidden;margin-top:80px;}
.page-hero-mask{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(6,14,26,1) 0%,rgba(6,14,26,.55) 55%,rgba(6,14,26,.1) 100%);}
.page-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.6);}
.page-hero-inner{position:relative;z-index:2;padding:0 8% 50px;}
.page-eyebrow{font-size:10px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
.page-h1{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,5vw,62px);font-weight:300;line-height:1.05;}
.page-h1 em{font-style:italic;color:var(--gold);}
.cs{padding:80px 8%;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}

/* ══ HOME HERO ══ */
.hero{position:relative;height:100vh;min-height:700px;
  display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.hero-slides{position:absolute;inset:0;}
.hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity 2s ease;}
.hero-slide.on{opacity:1;}
.hero-mask{position:absolute;inset:0;
  background:linear-gradient(110deg,rgba(6,14,26,.97) 0%,rgba(6,14,26,.82) 42%,
    rgba(6,14,26,.2) 72%,rgba(6,14,26,.03) 100%);}
.hero-grid-bg{position:absolute;inset:0;
  background-image:linear-gradient(rgba(201,168,76,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(201,168,76,.035) 1px,transparent 1px);
  background-size:55px 55px;}
.hero-content{position:relative;z-index:2;padding:0 8%;max-width:760px;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:10px;padding:6px 16px;
  border:1px solid var(--border);border-radius:22px;font-size:10px;color:var(--gold);
  letter-spacing:2.5px;text-transform:uppercase;margin-bottom:26px;animation:fadeUp .9s both;}
.hero-dot{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.hero-tagline{font-family:'Cormorant Garamond',serif;font-size:clamp(14px,1.5vw,18px);
  color:var(--gold);letter-spacing:3px;text-transform:uppercase;
  margin-bottom:14px;animation:fadeUp .9s .05s both;}
.hero-h1{font-family:'Cormorant Garamond',serif;font-size:clamp(44px,6vw,88px);
  font-weight:300;line-height:1.02;margin-bottom:24px;animation:fadeUp .9s .12s both;}
.hero-h1 em{font-style:italic;color:var(--gold);}
.hero-h1 strong{font-weight:600;}
.hero-sub{font-size:16px;font-weight:300;color:var(--gray);line-height:1.85;
  margin-bottom:38px;max-width:580px;animation:fadeUp .9s .22s both;}
.hero-sub strong{color:rgba(255,255,255,.78);font-weight:400;}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;animation:fadeUp .9s .32s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}

/* STATS BAR */
.stats-bar{position:absolute;bottom:0;left:0;right:0;z-index:2;
  background:rgba(4,10,20,.9);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);}
.stat-item{padding:22px 24px;border-right:1px solid var(--border);text-align:center;}
.stat-item:last-child{border-right:none;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;
  color:var(--gold);line-height:1;}
.stat-lbl{font-size:10px;color:var(--gray);letter-spacing:1.5px;text-transform:uppercase;margin-top:5px;}

/* FULL-WIDTH IMAGE SECTION */
.full-img-section{position:relative;height:480px;overflow:hidden;}
.full-img-section img{width:100%;height:100%;object-fit:cover;filter:brightness(.55);}
.full-img-overlay{position:absolute;inset:0;
  background:linear-gradient(to right,rgba(6,14,26,.9) 0%,rgba(6,14,26,.4) 50%,rgba(6,14,26,.1) 100%);}
.full-img-content{position:absolute;inset:0;display:flex;align-items:center;padding:0 8%;}
.full-img-text{max-width:560px;}

/* PHOTO GRID */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;}
.photo-cell{position:relative;height:240px;overflow:hidden;}
.photo-cell img{width:100%;height:100%;object-fit:cover;
  transition:transform .7s;filter:brightness(.6);}
.photo-cell:hover img{transform:scale(1.07);filter:brightness(.85);}
.photo-overlay{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(6,14,26,.85) 0%,transparent 55%);}
.photo-label{position:absolute;bottom:16px;left:18px;font-size:10px;
  color:var(--gold);letter-spacing:2px;text-transform:uppercase;z-index:2;}
body.ar .photo-label{left:auto;right:18px;}

/* INDUSTRIES HOME */
.ind-section{padding:100px 8%;background:var(--darker);
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.ind-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:55px;}
.ind-card{padding:40px 30px;background:rgba(13,31,60,.5);border:1px solid var(--border2);
  position:relative;overflow:hidden;cursor:pointer;transition:all .4s;}
.ind-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(to right,var(--gold),var(--gold2));
  transform:scaleX(0);transform-origin:left;transition:transform .4s;}
.ind-card:hover::before{transform:scaleX(1);}
.ind-card:hover{background:rgba(201,168,76,.07);transform:translateY(-3px);}
body.ar .ind-card::before{transform-origin:right;}
.ind-icon{font-size:36px;margin-bottom:18px;}
.ind-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;
  color:var(--white);margin-bottom:10px;}
.ind-sub{font-size:12px;color:var(--gray);line-height:1.7;margin-bottom:18px;}
.ind-tags{display:flex;flex-wrap:wrap;gap:5px;}
.ind-tag{padding:3px 9px;background:rgba(201,168,76,.1);
  border:1px solid rgba(201,168,76,.2);color:rgba(201,168,76,.85);
  font-size:10px;border-radius:20px;}

/* WHY US */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:50px;}
.why-card{padding:40px 32px;background:rgba(13,31,60,.4);border:1px solid var(--border2);transition:all .35s;}
.why-card:hover{background:rgba(201,168,76,.05);border-color:var(--border);}
.why-icon{font-size:30px;margin-bottom:14px;}
.why-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;
  color:var(--white);margin-bottom:10px;}
.why-text{font-size:13px;color:var(--gray);line-height:1.8;}

/* SERVICES */
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:50px;}
.svc-card{padding:44px 38px;background:rgba(13,31,60,.5);border:1px solid var(--border2);
  position:relative;overflow:hidden;transition:all .4s;}
.svc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(to right,var(--gold),var(--gold2));
  transform:scaleX(0);transform-origin:left;transition:transform .4s;}
.svc-card:hover::before{transform:scaleX(1);}
.svc-card:hover{background:rgba(201,168,76,.06);}
.svc-num{position:absolute;top:16px;right:22px;font-family:'Cormorant Garamond',serif;
  font-size:64px;font-weight:300;color:rgba(201,168,76,.06);line-height:1;}
.svc-icon{font-size:34px;margin-bottom:18px;}
.svc-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;
  color:var(--white);margin-bottom:12px;}
.svc-desc{font-size:13px;color:var(--gray);line-height:1.85;margin-bottom:18px;}
.svc-list{list-style:none;}
.svc-list li{font-size:12px;color:rgba(255,255,255,.5);padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.05);display:flex;gap:8px;}
.svc-list li::before{content:'›';color:var(--gold);flex-shrink:0;}

/* INDUSTRIES PAGE */
.ind-tabs{display:flex;gap:5px;flex-wrap:wrap;margin:40px 0 0;}
.ind-tab{padding:10px 22px;background:transparent;border:1px solid var(--border);
  color:var(--gray);font-size:11px;letter-spacing:1px;cursor:pointer;
  border-radius:3px;transition:all .3s;font-family:'DM Sans',sans-serif;text-transform:uppercase;}
.ind-tab.on,.ind-tab:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:600;}
.ind-panel{display:none;}
.ind-panel.on{display:block;}
.ind-panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:50px;align-items:start;}
.ind-panel-img{width:100%;height:340px;object-fit:cover;border-radius:3px;filter:brightness(.8);}
.ind-panel-img2{width:100%;height:200px;object-fit:cover;border-radius:3px;filter:brightness(.75);margin-top:3px;}
.product-list{margin-top:24px;display:flex;flex-direction:column;gap:2px;}
.product-item{padding:14px 18px;background:rgba(13,31,60,.4);border:1px solid var(--border2);
  display:flex;align-items:center;gap:12px;transition:all .3s;}
.product-item:hover{background:rgba(201,168,76,.05);border-color:var(--border);}
.product-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;}
.product-name{font-size:14px;color:var(--white);font-weight:300;}
.product-detail{font-size:11px;color:var(--gray);margin-left:auto;}
body.ar .product-detail{margin-left:0;margin-right:auto;}
.ind-specs{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:24px;}
.spec-card{padding:16px 18px;background:rgba(201,168,76,.05);border:1px solid var(--border);}
.spec-label{font-size:9px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
.spec-val{font-size:13px;color:rgba(255,255,255,.75);}

/* ABOUT */
.vmv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:50px;}
.vmv-card{padding:40px 32px;background:rgba(13,31,60,.4);border:1px solid var(--border2);transition:all .3s;}
.vmv-card:hover{background:rgba(201,168,76,.05);border-color:var(--border);}
.vmv-icon{font-size:28px;margin-bottom:16px;}
.vmv-h{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;
  color:var(--gold);margin-bottom:12px;}
.vmv-text{font-size:13px;color:var(--gray);line-height:1.9;}
.values-list{list-style:none;margin-top:8px;}
.values-list li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);
  font-size:13px;color:var(--gray);display:flex;align-items:center;gap:8px;}
.values-list li::before{content:'›';color:var(--gold);}

/* PROCESS STEPS */
.process-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:50px;}
.step-card{padding:36px 20px;background:rgba(6,14,26,.5);border:1px solid var(--border2);text-align:center;}
.step-num{width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--navy);font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.step-title{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:500;
  color:var(--white);margin-bottom:8px;}
.step-text{font-size:12px;color:var(--gray);line-height:1.7;}

/* CONTACT */
.contact-layout{display:grid;grid-template-columns:1fr 1.4fr;gap:70px;margin-top:50px;}
.cinfo-block h3{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;margin-bottom:8px;}
.cinfo-block p{font-size:14px;color:var(--gray);line-height:1.8;margin-bottom:26px;}
.cinfo-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);}
.ci-icon{font-size:18px;margin-top:2px;width:22px;flex-shrink:0;}
.ci-label{font-size:9px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
.ci-val{font-size:14px;color:var(--white);font-weight:300;text-decoration:none;transition:color .3s;}
.ci-val:hover{color:var(--gold);}
.wa-big-btn{display:inline-flex;align-items:center;gap:10px;margin-top:20px;
  padding:13px 24px;background:linear-gradient(135deg,#25d366,#128c7e);
  color:#fff;font-size:13px;font-weight:500;border-radius:3px;
  text-decoration:none;transition:all .3s;}
.wa-big-btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(37,211,102,.3);}
.hours-box{margin-top:22px;padding:22px;background:rgba(201,168,76,.05);
  border:1px solid var(--border);border-radius:3px;}
.hours-title{font-size:9px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
.hours-row{display:flex;justify-content:space-between;font-size:13px;color:var(--gray);
  padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.hours-row:last-child{border-bottom:none;}

/* FORM */
.cform{background:rgba(13,31,60,.5);border:1px solid var(--border);padding:44px;border-radius:3px;}
.cform-h{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;margin-bottom:6px;}
.cform-sub{font-size:13px;color:var(--gray);margin-bottom:28px;line-height:1.6;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:9.5px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;}
.fg input,.fg select,.fg textarea{width:100%;padding:12px 14px;
  background:rgba(6,14,26,.8);border:1px solid var(--border);
  color:var(--white);font-size:13px;border-radius:3px;outline:none;
  font-family:'DM Sans',sans-serif;transition:border-color .3s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold);}
.fg textarea{resize:vertical;min-height:130px;}
.fg select option{background:var(--navy);}
.fsub{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--navy);font-size:12px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;border:none;border-radius:3px;cursor:pointer;
  transition:all .3s;font-family:'DM Sans',sans-serif;}
.fsub:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(201,168,76,.4);}

/* FOOTER */
footer{
